{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Вход в систему</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-ok">{{ success }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Имя пользователя<input name="username" required></label>
    <label>Пароль<input name="password" type="password" required></label>
    <button class="btn" type="submit">Войти</button>
  </form>
  <p>Нет аккаунта? <a href="/register">Регистрация</a></p>
  <p class="hint">Демо-доступы: admin/admin123, employee/emp123</p>
</div>
{% endblock %}
