{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Регистрация</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <label>Имя пользователя<input name="username" required minlength="3"></label>
    <label>Пароль<input name="password" type="password" required minlength="4"></label>
    <label>ФИО<input name="full_name"></label>
    <label>Телефон<input name="phone" type="tel"></label>
    <button class="btn" type="submit">Зарегистрироваться</button>
  </form>
  <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
